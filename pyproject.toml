[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-vlm"
version = "0.1.0"
description = "Zero-shot object counting through active semantic perception with SAM3 and Qwen"
readme = "README.MD"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "torch",
    "transformers>=5.0.0",
    "scipy",
    "pillow",
    "opencv-python",
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "real_models: Tests that require actual SAM3/Qwen backends."
]
